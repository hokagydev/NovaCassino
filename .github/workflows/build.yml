name: Build NovaCassino

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настраиваем Java 21 (так как Minecraft 1.21.1 требует именно 21 версию)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Настраиваем и кэшируем Gradle (чтобы сборки выполялись в разы быстрее)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Выдаем права на исполнение скрипту gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Собираем плагин
      - name: Build with Gradle
        run: ./gradlew build

      # 6. Загружаем собранный .jar файл в артефакты GitHub (можно будет скачать прямо со страницы сборки)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCassino-Plugin
          path: build/libs/NovaCassino-*.jar

      # 7. Если ты создаешь Release на GitHub — готовый .jar автоматически прикрепится к релизу
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/NovaCassino-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
